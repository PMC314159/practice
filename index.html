/* 처음에는 어두운 화면과 검색창만 표시합니다. */
.entry-screen{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0e0917;transition:opacity .65s ease,visibility .65s}.entry-screen.leaving{opacity:0;visibility:hidden;pointer-events:none}
.search-dock{position:relative;width:min(350px,calc(100vw - 52px));z-index:20;animation:searchRise 1.05s cubic-bezier(.16,1,.3,1) both}

.search-button{display:grid;place-items:center;flex-shrink:0;width:43px;height:43px;padding:0;border-radius:50%;border:1px solid #dfc8ff26;background:linear-gradient(#d7bbff20,#d7bbff09);color:#e2d5f5;box-shadow:inset 0 1px 0 #ffffff18;transition:background .25s,transform .25s}.search-button svg{width:22px;height:22px}.search-button:hover,.search-button[aria-expanded=true]{background:#d7bbff29}.search-button:hover{transform:scale(1.04)}

/* 홈은 하나의 그림과, 그 너비에 맞춘 음악 바만 남깁니다. */
.home-screen{width:min(880px,calc(100% - 64px));margin:0 auto;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:76px 0 66px;position:relative}

.music-player{width:100%;min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:20px;padding:10px 15px 10px 23px;border:1px solid #d8c5f233;border-radius:999px;background:#1a14237a;box-shadow:inset 0 1px 0 #ffffff05;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:barRise 1s cubic-bezier(.16,1,.3,1) .18s both}
.music-left{display:flex;align-items:center;gap:13px;min-width:0}.music-icon{color:#bca2ff;font-size:23px;line-height:1;flex-shrink:0}.music-title{font-size:13px;color:#d7cede;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}.music-controls{flex-shrink:0;display:flex;gap:12px;align-items:center}.music-btn{width:41px;height:41px;padding:0;display:grid;place-items:center;background:#ffffff05;border:1px solid #e8d5ff30;border-radius:50%;color:#f8f4fd;font:16px Arial,sans-serif}.music-btn.small{width:20px;height:32px;background:transparent;border-color:transparent;font-size:22px;color:#b0a3bd}.music-btn:hover{background:#d9baff15}.music-btn.small:hover{background:transparent;color:#fff}.music-status{margin:10px 5px 0;min-height:0;font-size:10px;line-height:1.7;color:var(--muted);text-align:center}.music-status:empty{display:none}

.search-history{position:absolute;top:calc(100% + 10px);left:0;right:0;z-index:20;overflow:hidden;border:1px solid #ddc8ff36;border-radius:24px;background:linear-gradient(135deg,#30253ef5,#1c1429f7);box-shadow:0 20px 55px #08031066,inset 0 1px 0 #ffffff0d;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);animation:historyOpen .25s ease both}
.history-heading{margin:0;padding:20px 21px 10px;font-size:10px;font-weight:300;letter-spacing:.13em;color:#cbb9df}.history-list{margin:0;padding:0 9px 10px;list-style:none}.history-list a{display:flex;align-items:center;gap:12px;min-height:51px;padding:10px 12px;border-radius:14px;transition:background .2s}.history-list a:hover,.history-list a:focus-visible{background:#d9c2ff10}.history-clock{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#dfc8ff09;color:#b6a4cb;flex-shrink:0}.history-clock svg{width:16px;height:16px}.history-name{font-size:14px;letter-spacing:-.02em}.history-arrow{margin-left:auto;color:#a393b3;font-size:17px}

<script>
/* ================= 수정할 설정 =================
   첨부한 메인 그림은 HTML에 포함되어 있어서 별도 업로드 없이 보입니다.
   hero를 빈 문자열로 두면 포함된 그림을 사용합니다.
   음악은 기존 common.js가 있으면 기존 재생목록을 사용합니다.
================================================= */
const HOME={
 title:'Midnight Hour',
 searchText:'자정의 시간',
 hero:'', // 다른 그림으로 교체: './main-visual.jpg'
 categories:{personnel:'./personnel/',timeline:'./timeline/',fragments:'./fragments/',stills:'./stills/'},
 // 카테고리별 메인 일러스트 경로입니다. 기존 홈페이지의 파일명을 사용합니다.
 categoryImages:{personnel:'./main-personnel.jpg',timeline:'./main-timeline.jpg',fragments:'./main-fragments.jpg',stills:'./main-stills.png'},
 commonScript:'./common.js?v=6',
 musicFile:'', // common.js가 없을 경우 실제 음악 경로. 예: './music/long-night.mp3'
 musicTitle:'긴 밤(feat. 기리보이) - Seori'
};
(()=>{'use strict';
const $=id=>document.getElementById(id),button=$('searchButton'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let entered=false,typingTimer=null,commonReady=false,fallback=false;
$('siteTitle').textContent=HOME.title;document.title=HOME.title;$('music-title').textContent=HOME.musicTitle;
const hero=$('heroImage'),defaultHero=HOME.hero||hero.src;
hero.src=defaultHero;
function finishTyping(){clearTimeout(typingTimer);$('searchText').textContent=HOME.searchText;$('searchBox').classList.add('typed')}
function type(){if(reduced){finishTyping();return}const letters=Array.from(HOME.searchText);let n=0;function tick(){if(entered)return;$('searchText').textContent=letters.slice(0,++n).join('');if(n<letters.length)typingTimer=setTimeout(tick,150);else finishTyping()}typingTimer=setTimeout(tick,600)}
function enter(){if(entered)return;entered=true;finishTyping();$('homeScreen').hidden=false;document.body.classList.add('entered');$('entryScreen').classList.add('leaving');$('entryScreen').setAttribute('aria-hidden','true');setTimeout(()=>{$('entryScreen').hidden=true;$('categoryButton').focus({preventScroll:true})},reduced?0:650)}
button.addEventListener('click',enter);
const categoryButton=$('categoryButton'),menu=$('categoryMenu'),dock=$('categoryDock'),options=[...menu.querySelectorAll('[data-category]')];
function setMenu(open,focusFirst=false){menu.hidden=!open;categoryButton.setAttribute('aria-expanded',String(open));categoryButton.setAttribute('aria-label',open?'카테고리 닫기':'카테고리 열기');if(open&&focusFirst)options[0].focus()}
categoryButton.addEventListener('click',()=>setMenu(menu.hidden));
categoryButton.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();setMenu(true,true)}});
menu.addEventListener('keydown',e=>{let n=options.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();options[(n+(e.key==='ArrowDown'?1:-1)+options.length)%options.length].focus()}else if(e.key==='Home'){e.preventDefault();options[0].focus()}else if(e.key==='End'){e.preventDefault();options.at(-1).focus()}});
let selectionToken=0;
function selectCategory(option){
 const key=option.dataset.category,label=option.firstElementChild.textContent,token=++selectionToken;
 options.forEach(item=>item.setAttribute('aria-pressed',String(item===option)));
 $('selectionName').textContent=label;$('heroPlay').href=HOME.categories[key];$('heroPlay').setAttribute('aria-label',label+' 페이지로 이동');$('selectionStatus').textContent='';
 setMenu(false);categoryButton.focus({preventScroll:true});
 const frame=hero.closest('.tablet');frame.classList.add('loading');
 const preview=new Image();preview.onload=()=>{if(token!==selectionToken)return;hero.src=preview.src;hero.alt=label+' 메인 일러스트';frame.classList.remove('loading')};
 preview.onerror=()=>{if(token!==selectionToken)return;hero.src=defaultHero;hero.alt='페어 메인 일러스트';frame.classList.remove('loading');$('selectionStatus').textContent=label+' 일러스트를 불러오지 못해 메인 그림을 표시했어요.'};
 preview.src=HOME.categoryImages[key]||defaultHero;
}
options.forEach(option=>option.addEventListener('click',()=>selectCategory(option)));
document.addEventListener('pointerdown',e=>{if(!dock.contains(e.target))setMenu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){setMenu(false);categoryButton.focus()}else if(e.key==='Enter'&&!entered&&e.target===document.body){e.preventDefault();enter()}});
dock.addEventListener('focusout',()=>setTimeout(()=>{if(!dock.contains(document.activeElement))setMenu(false)},0));
let booted=false;function boot(){if(booted)return;booted=true;type()}
if(document.fonts?.ready){Promise.race([document.fonts.ready,new Promise(resolve=>setTimeout(resolve,800))]).then(boot)}else boot();
/* 기존 common.js가 사용하는 ID를 유지합니다. */
const audio=$('bgm');
function sync(){const play=$('music-btn');play.textContent=audio.paused?'▶':'Ⅱ';play.setAttribute('aria-label',audio.paused?'음악 재생':'음악 일시정지')}
['play','pause','ended','emptied'].forEach(e=>audio.addEventListener(e,sync));
async function toggle(){ $('musicStatus').textContent='';try{if(commonReady&&typeof window.toggleMusic==='function')await window.toggleMusic();else if(audio.paused){if(!audio.getAttribute('src')&&!audio.querySelector('source')){$('musicStatus').textContent='음악 파일을 준비 중입니다.';return}await audio.play()}else audio.pause()}catch{$('musicStatus').textContent='음악을 불러오지 못했어요.'}sync()}
$('music-btn').onclick=toggle;
function track(dir){$('musicStatus').textContent='';if(!commonReady)return;const fn=dir<0?window.prevTrack:window.nextTrack;if(typeof fn==='function'){try{const result=fn();if(result?.catch)result.catch(()=>{$('musicStatus').textContent='음악을 불러오지 못했어요.'})}catch{$('musicStatus').textContent='음악을 불러오지 못했어요.'}}}
$('previousTrack').onclick=()=>track(-1);$('followingTrack').onclick=()=>track(1);
function useFallback(){if(fallback)return;fallback=true;commonReady=false;$('previousTrack').disabled=true;$('followingTrack').disabled=true;if(HOME.musicFile){audio.src=HOME.musicFile;audio.loop=true;audio.load()}}
if(HOME.commonScript){const script=document.createElement('script');script.src=HOME.commonScript;script.onload=()=>{commonReady=typeof window.toggleMusic==='function';if(!commonReady)useFallback();sync()};script.onerror=useFallback;document.body.append(script)}else useFallback();
audio.addEventListener('error',()=>{$('musicStatus').textContent='음악을 불러오지 못했어요.'});sync();
})();
</script>
